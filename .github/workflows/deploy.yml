name: Deploy Website with GitHub Actions

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # JOB 1: KIEM TRA CODE
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Da co du 3 file"

      - name: Check HTML title
        run: |
          grep -Eiq '<title[^>]*>.*</title>' index.html
          echo "HTML title hop le"

  # JOB 2: DEPLOY WEBSITE
  deploy:
    needs: check
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4