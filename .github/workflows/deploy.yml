
name: CI-CD Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # JOB 1: KIEM TRA MA NGUON
  check:
    name: Check Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          test -f index.html || {
            echo "ERROR: Missing index.html"
            exit 1
          }

          test -f style.css || {
            echo "ERROR: Missing style.css"
            exit 1
          }

          test -f script.js || {
            echo "ERROR: Missing script.js"
            exit 1
          }

          echo "All required files exist!"

      - name: Check HTML title
        run: |
          if grep -Eiq '<title([[:space:]>])' index.html; then
            echo "HTML title found!"
          else
            echo "ERROR: Missing title tag!"
            exit 1
          fi

  # JOB 2: DEPLOY WEBSITE
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
